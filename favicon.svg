<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- jslet.com 红底白字站标: 红底圆角方块 + 白色 j 字母 -->
  <defs>
    <linearGradient id="redbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF1A3D"/>
      <stop offset="1" stop-color="#C4001F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- 红底圆角方块 -->
  <rect width="64" height="64" rx="16" fill="url(#redbg)"/>
  <rect width="64" height="30" rx="16" fill="url(#gloss)"/>
  <!-- 底部内阴影 -->
  <rect x="0" y="48" width="64" height="16" fill="#7A0013" opacity="0.28"/>
  <!-- j 字母: 顶部圆点 (.com 的句点暗喻) -->
  <circle cx="40" cy="16" r="5" fill="#ffffff"/>
  <!-- j 字母: 竖杆 + 底部左钩 -->
  <path d="M40 27 L40 45 C40 52.5 30 54.5 26.5 48" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
